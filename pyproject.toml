[project]
name = "churnlens"
version = "0.1.0"
description = "Enterprise B2B telemetry and churn intelligence platform (portfolio project)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "faker>=30.0",
    "fastapi>=0.162.0",
    "matplotlib>=3.11.2",
    "numpy>=2.0",
    "pandas>=2.2",
    "plotly>=7.1.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=17.0",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "streamlit>=1.66.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# Pinned rule set, so `ruff check` gives the same answer on every machine and in CI:
# E/W = style errors, F = real bugs (unused names, undefined variables), I = import order,
# B = common bug patterns, UP = modern Python syntax
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["B905"]  # zip(strict=...) adds noise for beginners; our zips always pair equal lists

[tool.ruff.lint.isort]
# The dashboard imports its helper module as `data`. Without this line ruff decides
# whether `data` is ours by checking for a data/ folder, which exists on your laptop
# but not on a fresh GitHub runner, so the two would disagree about import order.
known-first-party = ["data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # lets tests import config.py and generate/
# Starlette suggests a newer test HTTP library; the current one works fine, so hide the notice.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
